name: arcade

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: generate bomberman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: reyzdev
          # ganti tambah game lain: 'pacman,bomberman,tetris'
          games: 'bomberman'
      - name: grayscale (monochrome)
        run: |
          for f in dist/*.svg; do
            sed -i '0,/<svg/{s/<svg/<svg style="filter:grayscale(1)"/}' "$f"
          done
      - name: push svg ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
